<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TravelPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1B2D; --paper:#EEF1EE; --panel:#FFFFFF; --amber:#C9822E; --amber-bg:#F4E3C8;
    --teal:#2F6F62; --teal-bg:#DCEAE6; --rust:#B8462F; --rust-bg:#F5DCD5;
    --text:#16202C; --text-soft:#51606F; --line:#D7DCD6; --focus:#2F6F62;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --paper:#0B1220; --panel:#131C2B; --text:#E7ECF2; --text-soft:#9AA7B5; --line:#243044; --ink:#060B14;
      --amber-bg:#3A2C15; --teal-bg:#132923; --rust-bg:#301A15;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0B1220; --panel:#131C2B; --text:#E7ECF2; --text-soft:#9AA7B5; --line:#243044; --ink:#060B14;
    --amber-bg:#3A2C15; --teal-bg:#132923; --rust-bg:#301A15;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--text);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-text-size-adjust:100%;
  }
  h1,h2,h3,h4,.label,.btn,.tab{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',SFMono-Regular,monospace;}
  a{color:inherit;}
  button{font:inherit; cursor:pointer;}
  input,select,textarea{font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:7px 9px;}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus); outline-offset:1px;}
  ::placeholder{color:var(--text-soft); opacity:0.8;}

  /* ---- Header board ---- */
  .board{
    background:var(--ink); color:#EDEFEF; padding:14px 18px;
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    display:flex; flex-wrap:wrap; gap:6px 28px; align-items:baseline;
    position:sticky; top:0; z-index:20; border-bottom:2px solid var(--amber);
  }
  .board .brand{font-weight:700; font-size:1.05rem; letter-spacing:0.02em; display:flex; align-items:center; gap:8px;}
  .board .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);}
  .board .field{display:flex; flex-direction:column; gap:1px;}
  .board .field .k{font-size:0.62rem; color:#9FB0BE; letter-spacing:0.08em;}
  .board .field .v{font-size:0.85rem; font-family:'IBM Plex Mono',monospace;}
  .board .field .v.amber{color:var(--amber);}
  .board .field .v.rust{color:#E58369;}
  .board .field .v.teal{color:#7FCBB8;}
  .board .spacer{flex:1;}

  /* ---- Layout ---- */
  .shell{display:flex; min-height:calc(100vh - 64px);}
  .rail{
    width:180px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line);
    padding:14px 0; position:sticky; top:64px; align-self:flex-start; height:calc(100vh - 64px); overflow-y:auto;
  }
  .tab{
    display:block; width:100%; text-align:left; background:none; border:none; border-left:3px solid transparent;
    padding:11px 18px; font-size:0.88rem; color:var(--text-soft); font-weight:500;
  }
  .tab.active{color:var(--text); border-left-color:var(--amber); background:var(--amber-bg);}
  .tab:hover:not(.active){background:var(--paper);}
  .main{flex:1; min-width:0; padding:22px 22px 60px;}
  .container{max-width:880px;}
  @media (max-width:760px){
    .shell{flex-direction:column;}
    .rail{
      width:100%; height:auto; position:sticky; top:64px; display:flex; overflow-x:auto; padding:6px 4px;
      border-right:none; border-bottom:1px solid var(--line);
    }
    .tab{width:auto; white-space:nowrap; border-left:none; border-bottom:3px solid transparent; padding:9px 14px;}
    .tab.active{border-left-color:transparent; border-bottom-color:var(--amber);}
    .main{padding:16px 14px 50px;}
    .board{gap:4px 16px; padding:12px 14px; padding-top:calc(12px + env(safe-area-inset-top,0px));}
  }

  h2.pagehead{font-size:1.25rem; margin:0 0 4px;}
  p.sub{color:var(--text-soft); margin:0 0 20px; font-size:0.9rem; max-width:56ch;}
  .panel{background:var(--panel); border:1px solid var(--line); padding:16px 18px; margin-bottom:16px;}
  .panel h3{margin:0 0 12px; font-size:0.95rem;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  @media (max-width:600px){ .grid2,.grid3{grid-template-columns:1fr;} }
  .field-row{display:flex; flex-direction:column; gap:4px; margin-bottom:10px;}
  .field-row label{font-size:0.72rem; color:var(--text-soft); font-weight:500; letter-spacing:0.02em;}
  .field-row input,.field-row select{width:100%;}
  .chip-toggle{
    display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border:1px solid var(--line);
    background:var(--panel); font-size:0.8rem; margin:0 6px 6px 0; user-select:none;
  }
  .chip-toggle.on{background:var(--teal-bg); border-color:var(--teal); color:var(--teal);}
  .btn{
    display:inline-block; border:1px solid var(--ink); background:var(--ink); color:#fff;
    padding:9px 16px; font-size:0.85rem; font-weight:600; border-radius:3px;
  }
  .btn:hover{opacity:0.9;}
  .btn.secondary{background:var(--panel); color:var(--text); border-color:var(--line);}
  .btn.danger{background:var(--rust); border-color:var(--rust);}
  .btn.ghost{background:none; border:1px solid var(--line); color:var(--text-soft); padding:5px 10px; font-size:0.76rem;}
  .btn.small{padding:5px 10px; font-size:0.76rem;}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}

  /* ---- Timeline (Itinerary) ---- */
  .day-tabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px;}
  .day-tab{
    flex-shrink:0; padding:8px 13px; border:1px solid var(--line); background:var(--panel); font-size:0.8rem; text-align:center;
  }
  .day-tab .d1{font-weight:600;} .day-tab .d2{font-size:0.68rem; color:var(--text-soft);}
  .day-tab.active{border-color:var(--amber); background:var(--amber-bg);}
  .daybar{display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid var(--ink); padding-bottom:8px; margin-bottom:4px;}
  .daybar h3{margin:0; font-size:1.05rem;}
  .daybar .cost{font-family:'IBM Plex Mono',monospace; font-size:0.85rem;}
  .daybar .cost.over{color:var(--rust);}
  .timeline{position:relative; margin:10px 0 22px; padding-left:64px;}
  .titem{position:relative; padding:10px 0 10px 16px; border-left:1px solid var(--line); margin-left:2px;}
  .titem::before{content:""; position:absolute; left:-4.5px; top:16px; width:8px; height:8px; border-radius:50%; background:var(--ink);}
  .titem.meal::before, .titem.transport::before{background:var(--text-soft);}
  .titem .time{position:absolute; left:-80px; top:9px; width:66px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--text-soft);}
  .titem .tname{font-weight:600; font-size:0.92rem;}
  .titem .tmeta{font-size:0.76rem; color:var(--text-soft); margin-top:2px;}
  .titem .tcost{font-family:'IBM Plex Mono',monospace; font-size:0.78rem; margin-top:2px;}
  .titem .actions{margin-top:6px; display:flex; gap:6px; flex-wrap:wrap;}
  .tag{display:inline-block; font-size:0.68rem; padding:1px 7px; border-left:3px solid var(--text-soft); background:var(--paper); margin-right:4px;}
  .conflict-banner{background:var(--rust-bg); border-left:3px solid var(--rust); padding:9px 12px; font-size:0.82rem; margin-bottom:10px;}
  .empty-note{color:var(--text-soft); font-size:0.85rem; padding:10px 0;}
  .suggest-box{background:var(--teal-bg); border-left:3px solid var(--teal); padding:10px 12px; font-size:0.82rem; margin-top:8px;}
  .suggest-box .sitem{display:flex; justify-content:space-between; align-items:center; padding:4px 0; gap:8px;}

  /* ---- Places tab ---- */
  table{width:100%; border-collapse:collapse; font-size:0.82rem;}
  th{text-align:left; font-size:0.68rem; color:var(--text-soft); font-weight:600; letter-spacing:0.03em; border-bottom:1px solid var(--line); padding:6px 8px;}
  td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr.cancelled td{opacity:0.45; text-decoration:line-through;}
  .status-pill{font-size:0.68rem; padding:2px 7px; border-radius:2px;}
  .status-pill.scheduled{background:var(--teal-bg); color:var(--teal);}
  .status-pill.backup{background:var(--amber-bg); color:var(--amber);}
  .status-pill.cancelled{background:var(--rust-bg); color:var(--rust);}

  /* ---- Ask tab ---- */
  .ask-box{display:flex; gap:8px; margin-bottom:14px;}
  .ask-box input{flex:1;}
  .examples{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px;}
  .ex-chip{font-size:0.76rem; padding:5px 10px; border:1px solid var(--line); background:var(--panel); color:var(--text-soft);}
  .ex-chip:hover{border-color:var(--amber); color:var(--text);}
  .answer{background:var(--ink); color:#EDEFEF; padding:16px 18px; font-family:'IBM Plex Mono',monospace; font-size:0.86rem; line-height:1.6; white-space:pre-wrap; border-left:3px solid var(--amber); margin-bottom:14px;}
  .answer b{color:var(--amber);}
  .qa-log{display:flex; flex-direction:column-reverse; gap:14px;}
  .qa-item .q{font-weight:600; margin-bottom:6px; font-size:0.88rem;}

  /* ---- Dashboard ---- */
  .dash-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:700px){.dash-grid{grid-template-columns:1fr;}}
  .stat{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); font-size:0.85rem;}
  .stat .n{font-family:'IBM Plex Mono',monospace; font-weight:600;}
  .bignum{font-family:'IBM Plex Mono',monospace; font-size:1.6rem; font-weight:600;}
  @media print{
    .rail,.board .spacer,.no-print,.ask-box,.examples{display:none !important;}
    body{background:#fff; color:#000;}
    .panel{border:1px solid #999; break-inside:avoid;}
    .shell{display:block;}
    .main{padding:0;}
  }
  .notice{position:fixed; bottom:calc(16px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; font-size:0.82rem; z-index:50; border-left:3px solid var(--amber); max-width:90vw;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================== CONSTANTS ============================== */
const CATEGORIES = ['History','Food','Art','Nature','Nightlife','Shopping','Adventure','Relaxation','Family'];
const PACE_MINUTES = { relaxed:300, moderate:420, packed:540 };
const TRAVEL_SAME = { min:15, cost:0 };
const TRAVEL_DIFF = { min:40, cost:150 };
const MEAL_LUNCH_COST = 250;
const MEAL_DINNER_COST = 350;
const CAT_COLOR = {
  History:'#8A5A34', Food:'#B8462F', Art:'#5B4B8A', Nature:'#2F6F62', Nightlife:'#6A3B6E',
  Shopping:'#946A2B', Adventure:'#B8462F', Relaxation:'#2F6F62', Family:'#3B5C8A', Transit:'#51606F'
};

/* ============================== HELPERS ============================== */
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }
function pad2(n){ return String(n).padStart(2,'0'); }
function toISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return toISO(d); }
function diffDays(iso1,iso2){ const a=new Date(iso1+'T00:00:00'), b=new Date(iso2+'T00:00:00'); return Math.round((b-a)/86400000)+1; }
function timeStrToMin(s){ if(!s) return 0; const p=s.split(':'); return (+p[0])*60+(+p[1]); }
function minToTimeStr(m){ const h=Math.floor(m/60)%24, mm=m%60; return pad2(h)+':'+pad2(mm); }
function fmtTime(min){ let h=Math.floor(min/60), m=min%60; const ap=h>=12?'PM':'AM'; let h12=h%12; if(h12===0)h12=12; return h12+':'+pad2(m)+' '+ap; }
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDateLabel(iso){ const d=new Date(iso+'T00:00:00'); return WD[d.getDay()]+', '+d.getDate()+' '+MO[d.getMonth()]; }
function fmtDateShort(iso){ const d=new Date(iso+'T00:00:00'); return d.getDate()+' '+MO[d.getMonth()]; }
function fmtMoney(n){ return (state.currency||'₹') + Math.round(n||0).toLocaleString('en-IN'); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function catColor(c){ return CAT_COLOR[c] || '#51606F'; }
function sumCosts(items){ return items.reduce((s,i)=>s+(i.cost||0),0); }

/* ============================== SEED DATA ============================== */
function seedPois(){
  const P = [
    ['Old Fort Walking Tour','Old Town','History','08:00','18:00',90,300,4],
    ['Spice Market Wander','Old Town','Food','09:00','20:00',60,0,3],
    ['Old Town Cathedral','Old Town','History','09:00','17:00',45,100,3],
    ['Rooftop Sunset Café','Old Town','Relaxation','16:00','23:00',60,400,3],
    ['Riverside Art Museum','Riverside','Art','10:00','18:00',120,500,4],
    ['River Cruise','Riverside','Nature','11:00','19:00',90,800,5],
    ['Riverside Night Market','Riverside','Nightlife','18:00','23:00',90,200,3],
    ['Botanical Gardens','Riverside','Nature','07:00','19:00',100,150,4],
    ['Modern Art Gallery','Uptown','Art','10:00','19:00',75,350,3],
    ['Uptown Shopping District','Uptown','Shopping','10:00','21:00',90,0,2],
    ['Adventure Zipline Park','Uptown','Adventure','09:00','17:00',150,1200,5],
    ['Skyline Observation Deck','Uptown','Relaxation','09:00','22:00',60,600,3],
    ['Uptown Food Street','Uptown','Food','12:00','23:00',75,350,4],
    ['Family Aquarium','Uptown','Family','09:00','18:00',120,450,3]
  ];
  return P.map(r=>({
    id: uid('poi'), name:r[0], area:r[1], category:r[2],
    openMin:timeStrToMin(r[3]), closeMin:timeStrToMin(r[4]),
    durationMin:r[5], cost:r[6], priority:r[7], cancelled:false
  }));
}

function defaultState(){
  const today = new Date();
  const start = new Date(today); start.setDate(start.getDate()+14);
  const startIso = toISO(start);
  const endIso = addDays(startIso,3);
  return {
    currency:'₹',
    trip:{
      destination:'Kyoto, Japan', startDate:startIso, endDate:endIso,
      totalBudget:60000, pace:'moderate', dayStartMin:540, dayEndMin:1290,
      interests:['History','Food','Art','Nature']
    },
    accommodation:{ name:'Riverside Inn', area:'Riverside', costPerNight:3000 },
    transport:[
      { id:uid('tr'), name:'Airport Arrival Transfer', date:startIso, startMin:540, endMin:600, cost:800, area:'Riverside' },
      { id:uid('tr'), name:'Airport Departure Transfer', date:endIso, startMin:1020, endMin:1080, cost:800, area:'Riverside' }
    ],
    pois: seedPois(),
    days:[],
    backupPool:[],
    currentDayIndex:0,
    activeTab:'setup',
    editingPoiId:null,
    editingTransportId:null,
    qaLog:[],
    notice:null
  };
}

/* ============================== STATE LOAD/SAVE ============================== */
let state;
function save(){ try{ localStorage.setItem('travelpilot_v1', JSON.stringify(state)); }catch(e){ /* storage unavailable */ } }
function load(){
  try{
    const raw = localStorage.getItem('travelpilot_v1');
    if(raw){ state = JSON.parse(raw); return true; }
  }catch(e){ /* ignore */ }
  return false;
}

/* ============================== SCHEDULING ENGINE ============================== */
function activityItemFromPoi(poi,startMin){
  return { id:uid('it'), type:'activity', name:poi.name, category:poi.category, area:poi.area,
    startMin, endMin:startMin+poi.durationMin, cost:poi.cost, status:'planned', poiId:poi.id, source:{...poi} };
}
function transferItem(fromArea,toArea,startMin,durMin,cost){
  return { id:uid('tf'), type:'transport', name:'Transfer: '+fromArea+' → '+toArea, category:'Transit', area:toArea,
    startMin, endMin:startMin+durMin, cost, status:'auto', isTransfer:true };
}
function mealItem(name,startMin,durMin,cost){
  return { id:uid('ml'), type:'meal', name, category:'Food', area:null, startMin, endMin:startMin+durMin, cost, status:'auto' };
}
function transportBookingItem(tr){
  return { id:tr.id, type:'transport', name:tr.name, category:'Transit', area:tr.area,
    startMin:tr.startMin, endMin:tr.endMin, cost:tr.cost, status:'booked', locked:true };
}

function scoreOf(poi,currentArea,interests){
  let s=0;
  if(poi.area===currentArea) s+=3;
  if(interests && interests.includes(poi.category)) s+=2;
  s += (poi.priority||3)*0.5;
  s -= (poi.cost||0)/1000;
  return s;
}
function pickBestCandidate(pool,area,cursor,segEnd,interests,budgetRemaining){
  const eligible = pool.filter(p=>{
    const travelMin = p.area===area ? TRAVEL_SAME.min : TRAVEL_DIFF.min;
    const arrival = Math.max(cursor+travelMin, p.openMin);
    return arrival+p.durationMin<=segEnd && arrival+p.durationMin<=p.closeMin;
  });
  if(!eligible.length) return null;
  const withinBudget = eligible.filter(p=>{
    const travelCost = p.area===area ? TRAVEL_SAME.cost : TRAVEL_DIFF.cost;
    return (travelCost+p.cost) <= budgetRemaining;
  });
  const candidates = withinBudget.length ? withinBudget : eligible;
  candidates.sort((a,b)=>scoreOf(b,area,interests)-scoreOf(a,area,interests));
  return candidates[0];
}
function fillSegment(pool, cursor, area, segEnd, budgetRemaining, interests, paceRemaining, mealState){
  const items=[]; let spent=0, used=0; let workPool=pool.slice(); let guard=0;
  while(cursor<segEnd && used<paceRemaining && guard<30){
    guard++;
    if(!mealState.lunch && cursor>=690 && cursor<840 && cursor+60<=segEnd){
      items.push(mealItem('Lunch break',cursor,60,MEAL_LUNCH_COST)); spent+=MEAL_LUNCH_COST; cursor+=60; mealState.lunch=true; continue;
    }
    if(!mealState.dinner && cursor>=1140 && cursor<1290 && cursor+60<=segEnd){
      items.push(mealItem('Dinner',cursor,60,MEAL_DINNER_COST)); spent+=MEAL_DINNER_COST; cursor+=60; mealState.dinner=true; continue;
    }
    const candidate = pickBestCandidate(workPool, area, cursor, segEnd, interests, budgetRemaining-spent);
    if(!candidate) break;
    const travel = candidate.area===area ? TRAVEL_SAME : TRAVEL_DIFF;
    const arrival = Math.max(cursor+travel.min, candidate.openMin);
    if(arrival+candidate.durationMin>segEnd || arrival+candidate.durationMin>candidate.closeMin){
      workPool = workPool.filter(p=>p.id!==candidate.id); continue;
    }
    if(candidate.area!==area){ items.push(transferItem(area,candidate.area,cursor,travel.min,travel.cost)); spent+=travel.cost; }
    items.push(activityItemFromPoi(candidate,arrival));
    spent += candidate.cost; used += candidate.durationMin;
    cursor = arrival+candidate.durationMin; area = candidate.area;
    workPool = workPool.filter(p=>p.id!==candidate.id);
  }
  return { items, spent, used, pool:workPool };
}
function scheduleDay(fixedAnchors, pool, tripSettings, startArea, dayBudget){
  let segments=[]; let prevEnd=tripSettings.dayStartMin; let prevArea=startArea;
  for(const a of fixedAnchors){ segments.push({start:prevEnd,end:a.startMin,area:prevArea}); prevEnd=a.endMin; prevArea=a.area||prevArea; }
  segments.push({start:prevEnd,end:tripSettings.dayEndMin,area:prevArea});
  let allItems = fixedAnchors.map(a=>a.item);
  let spentTotal=0, usedTotal=0, workPool=pool.slice();
  const mealState={lunch:false,dinner:false};
  for(const seg of segments){
    if(seg.start>=seg.end) continue;
    const res = fillSegment(workPool, seg.start, seg.area, seg.end, dayBudget-spentTotal, tripSettings.interests, tripSettings.paceMinutes-usedTotal, mealState);
    allItems = allItems.concat(res.items);
    spentTotal += res.spent; usedTotal += res.used; workPool = res.pool;
  }
  allItems.sort((a,b)=>a.startMin-b.startMin);
  return { items:allItems, spent:spentTotal, pool:workPool };
}
function tripSettingsFrom(t){ return { dayStartMin:t.dayStartMin, dayEndMin:t.dayEndMin, interests:t.interests, paceMinutes:PACE_MINUTES[t.pace]||420 }; }

function rebuildItinerary(){
  const t = state.trip;
  if(!t.destination || !t.startDate || !t.endDate || diffDays(t.startDate,t.endDate)<1){
    state.days=[]; state.backupPool = state.pois.filter(p=>!p.cancelled).map(p=>({...p})); save(); render(); return;
  }
  const numDays = diffDays(t.startDate,t.endDate);
  const numNights = Math.max(numDays-1,0);
  const accomTotal = (state.accommodation.costPerNight||0)*numNights;
  const activityBudgetTotal = Math.max((t.totalBudget||0)-accomTotal, 0);
  const dayBudget = numDays>0 ? activityBudgetTotal/numDays : 0;
  let pool = state.pois.filter(p=>!p.cancelled).map(p=>({...p}));
  const ts = tripSettingsFrom(t);
  const days=[];
  for(let d=0; d<numDays; d++){
    const dateIso = addDays(t.startDate,d);
    const anchors = state.transport.filter(tr=>tr.date===dateIso).sort((a,b)=>a.startMin-b.startMin)
      .map(tr=>({ startMin:tr.startMin, endMin:tr.endMin, area:tr.area, item:transportBookingItem(tr) }));
    const startArea = (d===0 && anchors[0]) ? anchors[0].area : state.accommodation.area;
    const result = scheduleDay(anchors, pool, ts, startArea, dayBudget);
    days.push({ date:dateIso, items:result.items, spent:result.spent, budget:dayBudget });
    pool = result.pool;
  }
  state.days = days; state.backupPool = pool;
  if(state.currentDayIndex>=days.length) state.currentDayIndex=0;
  save(); render();
}

function rebuildSingleDay(dayIdx){
  const t = state.trip; const day = state.days[dayIdx]; if(!day) return;
  const currentSources = day.items.filter(i=>i.type==='activity' && i.source).map(i=>({...i.source}));
  let pool = state.backupPool.concat(currentSources);
  const anchors = state.transport.filter(tr=>tr.date===day.date).sort((a,b)=>a.startMin-b.startMin)
    .map(tr=>({ startMin:tr.startMin, endMin:tr.endMin, area:tr.area, item:transportBookingItem(tr) }));
  const startArea = (dayIdx===0 && anchors[0]) ? anchors[0].area : state.accommodation.area;
  const ts = tripSettingsFrom(t);
  const result = scheduleDay(anchors, pool, ts, startArea, day.budget);
  day.items = result.items; day.spent = result.spent; state.backupPool = result.pool;
  save(); render();
}

function rebuildAfter(dayIdx,itemId){
  const t = state.trip; const day = state.days[dayIdx]; if(!day) return;
  const idx = day.items.findIndex(i=>i.id===itemId); if(idx<0) return;
  const anchor = day.items[idx];
  const before = day.items.slice(0,idx+1);
  const rest = day.items.slice(idx+1);
  const lockedRest = rest.filter(i=>i.locked);
  const toRequeue = rest.filter(i=>!i.locked && i.type==='activity' && i.source);
  toRequeue.forEach(i=>state.backupPool.push({...i.source}));
  const fixedAfter = lockedRest.map(l=>({ startMin:l.startMin, endMin:l.endMin, area:l.area, item:l }));
  const ts = { dayStartMin:anchor.endMin, dayEndMin:t.dayEndMin, interests:t.interests, paceMinutes:PACE_MINUTES[t.pace]||420 };
  const result = scheduleDay(fixedAfter, state.backupPool, ts, anchor.area||state.accommodation.area, day.budget-sumCosts(before));
  day.items = before.concat(result.items);
  day.items.sort((a,b)=>a.startMin-b.startMin);
  state.backupPool = result.pool;
  day.spent = sumCosts(day.items);
  save(); render();
}

/* ---- gaps & suggestions ---- */
function gapsForDay(dayIdx){
  const t = state.trip; const day = state.days[dayIdx]; if(!day) return [];
  let cursor = t.dayStartMin; const gaps=[];
  const sorted = [...day.items].sort((a,b)=>a.startMin-b.startMin);
  for(const it of sorted){ if(it.startMin>cursor) gaps.push([cursor,it.startMin]); cursor=Math.max(cursor,it.endMin); }
  if(cursor<t.dayEndMin) gaps.push([cursor,t.dayEndMin]);
  return gaps;
}
function fitInGap(poi,gap){
  const arrival = Math.max(gap[0], poi.openMin);
  if(arrival+poi.durationMin<=gap[1] && arrival+poi.durationMin<=poi.closeMin) return arrival;
  return null;
}
function suggestionsForDay(dayIdx,limit){
  const gaps = gapsForDay(dayIdx); const out=[];
  for(const poi of state.backupPool){
    for(const g of gaps){
      const arrival = fitInGap(poi,g);
      if(arrival!=null){ out.push({poi,gapStart:arrival}); break; }
    }
    if(out.length>=(limit||4)) break;
  }
  return out;
}
function insertPoiIntoDay(dayIdx,poiId,atMin){
  const day = state.days[dayIdx]; if(!day) return {ok:false,msg:'No such day.'};
  const poi = state.backupPool.find(p=>p.id===poiId); if(!poi) return {ok:false,msg:'Not found in backups.'};
  const arrival = Math.max(atMin, poi.openMin);
  const end = arrival+poi.durationMin;
  const after = [...day.items].filter(i=>i.startMin>=arrival).sort((a,b)=>a.startMin-b.startMin)[0];
  if(after && end>after.startMin) return {ok:false,msg:"Doesn't fit before the next plan that day."};
  if(end>poi.closeMin) return {ok:false,msg:'Closes before the visit would finish.'};
  if(end>state.trip.dayEndMin) return {ok:false,msg:"Runs past the day's end time."};
  day.items.push(activityItemFromPoi(poi,arrival));
  day.items.sort((a,b)=>a.startMin-b.startMin);
  day.spent += poi.cost;
  state.backupPool = state.backupPool.filter(p=>p.id!==poi.id);
  return {ok:true};
}

/* ---- conflicts ---- */
function detectConflicts(day){
  const sorted = [...day.items].sort((a,b)=>a.startMin-b.startMin);
  const out=[];
  for(let i=0;i<sorted.length-1;i++){
    if(sorted[i].endMin>sorted[i+1].startMin) out.push([sorted[i],sorted[i+1]]);
  }
  return out;
}

/* ---- item actions ---- */
function cancelDayItem(dayIdx,itemId){
  const day = state.days[dayIdx]; if(!day) return;
  const idx = day.items.findIndex(i=>i.id===itemId); if(idx<0) return;
  const item = day.items[idx];
  if(item.locked){ setNotice("Booked transport can't be removed here — cancel it from the Places tab."); return; }
  let removeIdxs=[idx];
  if(idx>0){ const prev=day.items[idx-1]; if(prev.isTransfer && prev.endMin===item.startMin) removeIdxs.unshift(idx-1); }
  removeIdxs.sort((a,b)=>b-a).forEach(i=>{ day.spent-=day.items[i].cost; day.items.splice(i,1); });
  if(item.type==='activity' && item.source) state.backupPool.push({...item.source});
  setNotice('Removed "'+item.name+'". Check suggestions below to fill the gap.');
  save(); render();
}
function delayDayItem(dayIdx,itemId,deltaMin){
  const day = state.days[dayIdx]; const item = day.items.find(i=>i.id===itemId); if(!item) return;
  item.startMin += deltaMin; item.endMin += deltaMin;
  day.items.sort((a,b)=>a.startMin-b.startMin);
  setNotice('"'+item.name+'" moved by '+(deltaMin>0?'+':'')+Math.round(deltaMin/60*10)/10+'h.');
  save(); render();
}
function attemptInsert(dayIdx,poiId,gapStart){
  const res = insertPoiIntoDay(dayIdx,poiId,gapStart);
  setNotice(res.ok? 'Added to the day.' : res.msg);
  save(); render();
}
function togglePoiCancelled(poiId){
  const p = state.pois.find(x=>x.id===poiId); if(!p) return;
  p.cancelled = !p.cancelled;
  setNotice(p.cancelled? '"'+p.name+'" marked unavailable — itinerary rebuilt.' : '"'+p.name+'" available again — itinerary rebuilt.');
  rebuildItinerary();
}
function deletePoi(poiId){
  state.pois = state.pois.filter(p=>p.id!==poiId);
  state.backupPool = state.backupPool.filter(p=>p.id!==poiId);
  rebuildItinerary();
}
function cancelTransport(trId){
  const tr = state.transport.find(x=>x.id===trId); if(!tr) return;
  const dateIso = tr.date;
  state.transport = state.transport.filter(x=>x.id!==trId);
  const dayIdx = state.days.findIndex(d=>d.date===dateIso);
  setNotice('"'+tr.name+'" cancelled. Rebuilding that day...');
  if(dayIdx>=0) rebuildSingleDay(dayIdx); else { save(); render(); }
}
function setNotice(msg){ state.notice = msg; setTimeout(()=>{ if(state.notice===msg){ state.notice=null; render(); } }, 4500); }

/* ============================== NL QUERY ENGINE ============================== */
function findPoiByName(query){
  const q = query.toLowerCase();
  let best=null;
  const all = state.pois.concat(state.backupPool);
  for(const p of all){ if(p.name.toLowerCase().includes(q) || q.includes(p.name.toLowerCase())){ best=p; break; } }
  return best;
}
function locationOfPoi(poiId){
  for(let d=0; d<state.days.length; d++){
    const it = state.days[d].items.find(i=>i.poiId===poiId);
    if(it) return {type:'scheduled', dayIdx:d, item:it};
  }
  if(state.backupPool.find(p=>p.id===poiId)) return {type:'backup'};
  const p = state.pois.find(x=>x.id===poiId);
  if(p && p.cancelled) return {type:'cancelled'};
  return {type:'unknown'};
}
function describeItem(it){
  return fmtTime(it.startMin)+'–'+fmtTime(it.endMin)+' · '+it.name+(it.area?' ('+it.area+')':'')+' · '+fmtMoney(it.cost);
}
function answerQuery(q){
  const raw = q.trim(); const s = raw.toLowerCase();
  if(!state.days.length) return "There's no itinerary yet — finish the trip setup and I'll build one.";

  const cur = state.currentDayIndex;
  let targetDay = cur;
  if(s.includes('tomorrow')) targetDay = Math.min(cur+1, state.days.length-1);
  else if(s.includes('yesterday')) targetDay = Math.max(cur-1,0);

  // Q: close to hotel
  if(s.includes('close to') && (s.includes('hotel') || s.includes('accommodation') || s.includes('stay'))){
    const homeArea = state.accommodation.area;
    const matches = state.pois.filter(p=>!p.cancelled && p.area===homeArea);
    if(!matches.length) return "Nothing in the plan shares an area with "+ (state.accommodation.name||'your hotel') +" (" + homeArea + ") right now.";
    const lines = matches.map(p=>{
      const loc = locationOfPoi(p.id);
      const where = loc.type==='scheduled' ? 'Day '+(loc.dayIdx+1)+', '+fmtTime(loc.item.startMin) : (loc.type==='cancelled'?'unavailable':'not yet scheduled');
      return '• '+p.name+' — '+where+' · '+fmtMoney(p.cost);
    });
    return 'These are in the same area as '+(state.accommodation.name||'your hotel')+' ('+homeArea+'):\n'+lines.join('\n');
  }

  // Q: what should I do [today/tomorrow] [morning/afternoon/evening]
  if(s.includes('what should i do') || s.includes("what's on") || s.includes('what is on') || (s.includes('plan') && (s.includes('morning')||s.includes('afternoon')||s.includes('evening')))){
    const day = state.days[targetDay]; if(!day) return "That day isn't in the trip.";
    let items = day.items;
    let windowLabel='the day';
    if(s.includes('morning')){ items = items.filter(i=>i.startMin<720); windowLabel='the morning'; }
    else if(s.includes('afternoon')){ items = items.filter(i=>i.startMin>=720 && i.startMin<1020); windowLabel='the afternoon'; }
    else if(s.includes('evening') || s.includes('night')){ items = items.filter(i=>i.startMin>=1020); windowLabel='the evening'; }
    if(!items.length) return 'Nothing planned for '+windowLabel+' on '+fmtDateLabel(day.date)+' — a good time to add a backup pick from the Places tab.';
    return 'For '+windowLabel+' on '+fmtDateLabel(day.date)+':\n'+items.map(i=>'• '+describeItem(i)).join('\n');
  }

  // Q: what happens if X is cancelled
  if(s.includes('cancel') || s.includes('what happens if')){
    const nameGuess = raw.replace(/what happens if|is cancelled|gets cancelled|cancel(led)?|my|the|booking|activity|if|\?/gi,'').trim();
    const poi = findPoiByName(nameGuess) || findPoiByName(raw);
    if(!poi) return "I couldn't match that to an activity or booking in the plan. Try naming it exactly as it appears in the itinerary.";
    const loc = locationOfPoi(poi.id);
    if(loc.type!=='scheduled') return '"'+poi.name+'" is not currently scheduled, so cancelling it changes nothing in the itinerary.';
    const day = state.days[loc.dayIdx];
    const alts = state.backupPool.filter(p=>p.category===poi.category || p.area===poi.area).slice(0,3);
    let msg = 'If "'+poi.name+'" is cancelled on '+fmtDateLabel(day.date)+':\n';
    msg += '• Its '+describeItem(loc.item).split(' · ')[0]+' slot opens up, freeing '+fmtMoney(poi.cost)+'.\n';
    msg += alts.length ? '• Possible swaps: '+alts.map(a=>a.name).join(', ')+'.\n' : '• No close backup matches it right now — the slot would stay empty until you add one.\n';
    msg += "Use the Cancel button on that item in the Itinerary tab to apply this for real.";
    return msg;
  }

  // Q: can I fit X into today/tomorrow
  if(s.includes('fit') || s.includes('can i add') || s.includes('room for')){
    const nameGuess = raw.replace(/can i fit|into today|into tomorrow|today|tomorrow|can i add|room for|\?/gi,'').trim();
    const poi = findPoiByName(nameGuess);
    if(!poi) return "I couldn't find that activity. Add it in the Places tab first, then ask again.";
    const day = state.days[targetDay]; if(!day) return "That day isn't in the trip.";
    const gaps = gapsForDay(targetDay);
    let bestSlot=null;
    for(const g of gaps){ const arrival=fitInGap(poi,g); if(arrival!=null){ bestSlot=arrival; break; } }
    const remainingBudget = day.budget-day.spent;
    if(bestSlot==null) return 'No — "'+poi.name+'" (needs '+poi.durationMin+' min, open '+fmtTime(poi.openMin)+'–'+fmtTime(poi.closeMin)+') does not fit into any free slot on '+fmtDateLabel(day.date)+'.';
    let msg = 'Yes — "'+poi.name+'" could start at '+fmtTime(bestSlot)+' on '+fmtDateLabel(day.date)+' and finish by '+fmtTime(bestSlot+poi.durationMin)+'.';
    msg += poi.cost>remainingBudget ? ' Heads up: that would put the day '+fmtMoney(poi.cost-remainingBudget)+' over budget.' : ' It fits within the remaining day budget of '+fmtMoney(remainingBudget)+'.';
    return msg;
  }

  // fallback keyword search
  const words = s.split(/\s+/).filter(w=>w.length>2);
  const all = [];
  state.days.forEach((d,di)=>d.items.forEach(it=>all.push({...it,dayIdx:di,date:d.date})));
  state.backupPool.forEach(p=>all.push({name:p.name,category:p.category,area:p.area,cost:p.cost,backup:true}));
  const scored = all.map(it=>{
    let sc=0; const hay=(it.name+' '+(it.category||'')+' '+(it.area||'')).toLowerCase();
    words.forEach(w=>{ if(hay.includes(w)) sc++; });
    return {it,sc};
  }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,5);
  if(!scored.length) return "I don't have anything matching that in the trip yet. Try asking about a specific day, activity, or your hotel's area.";
  return 'Closest matches in the plan:\n'+scored.map(x=>{
    const it=x.it;
    return it.backup ? '• '+it.name+' — not yet scheduled ('+it.category+', '+it.area+')' : '• Day '+(it.dayIdx+1)+' '+fmtTime(it.startMin)+' — '+it.name;
  }).join('\n');
}

function saveTripSettings(){
  const t = state.trip;
  t.destination = document.getElementById('f-destination').value.trim();
  t.startDate = document.getElementById('f-start').value;
  t.endDate = document.getElementById('f-end').value;
  t.totalBudget = parseFloat(document.getElementById('f-budget').value)||0;
  t.pace = document.getElementById('f-pace').value;
  t.dayStartMin = timeStrToMin(document.getElementById('f-daystart').value);
  t.dayEndMin = timeStrToMin(document.getElementById('f-dayend').value);
  state.currency = document.getElementById('f-currency').value;
  state.accommodation.name = document.getElementById('f-hotel-name').value.trim();
  state.accommodation.area = document.getElementById('f-hotel-area').value.trim();
  state.accommodation.costPerNight = parseFloat(document.getElementById('f-hotel-cost').value)||0;
  if(t.endDate < t.startDate){ const tmp=t.startDate; t.startDate=t.endDate; t.endDate=tmp; }

  rebuildItinerary();
}

  if(i>=0) t.interests.splice(i,1); else t.interests.push(cat);

}

}

/* ============================== RENDER ============================== */
function tripTotals(){
  const numDays = state.days.length;
  const numNights = Math.max(numDays-1,0);
  const accomTotal = (state.accommodation.costPerNight||0)*numNights;
  const activitySpent = sumCosts(state.days.flatMap(d=>d.items));
  const totalSpent = accomTotal+activitySpent;
  const budget = state.trip.totalBudget||0;
  return {numDays,numNights,accomTotal,activitySpent,totalSpent,budget,remaining:budget-totalSpent};
}
function renderHeader(){
  const t = state.trip;
  const totals = tripTotals();
  const conflictCount = state.days.reduce((s,d)=>s+detectConflicts(d).length,0);
  const remClass = totals.remaining<0 ? 'rust' : 'teal';
  const statusText = conflictCount>0 ? conflictCount+' conflict'+(conflictCount>1?'s':'') : (totals.remaining<0?'Over budget':'On track');
  const statusClass = conflictCount>0 || totals.remaining<0 ? 'rust' : 'teal';
  return `<div class="board">
    <div class="brand"><span class="dot"></span>TravelPilot</div>
    <div class="field"><span class="k">DESTINATION</span><span class="v">${escapeHtml(t.destination||'—')}</span></div>
    <div class="field"><span class="k">DATES</span><span class="v">${t.startDate?fmtDateShort(t.startDate)+' – '+fmtDateShort(t.endDate):'—'}</span></div>
    <div class="field"><span class="k">BUDGET LEFT</span><span class="v amber">${state.days.length?fmtMoney(totals.remaining):'—'}</span></div>
    <div class="spacer"></div>
    <div class="field"><span class="k">STATUS</span><span class="v ${statusClass}">${statusText}</span></div>
  </div>`;
}

  const v = editing || { name:'', area:'', category:CATEGORIES[0], openMin:540, closeMin:1080, durationMin:60, cost:0, priority:3 };
  return `<div class="panel">
    <h3>${editing?'Edit place':'Add a place'}</h3>
    <div class="grid3">
      <div class="field-row"><label>Name</label><input id="p-name" value="${escapeHtml(v.name)}"></div>
      <div class="field-row"><label>Area</label><input id="p-area" value="${escapeHtml(v.area)}"></div>
      <div class="field-row"><label>Category</label><select id="p-cat">${CATEGORIES.map(c=>`<option value="${c}" ${v.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="field-row"><label>Opens</label><input id="p-open" type="time" value="${minToTimeStr(v.openMin)}"></div>
      <div class="field-row"><label>Closes</label><input id="p-close" type="time" value="${minToTimeStr(v.closeMin)}"></div>
      <div class="field-row"><label>Duration (min)</label><input id="p-dur" type="number" min="15" step="15" value="${v.durationMin}"></div>
      <div class="field-row"><label>Cost</label><input id="p-cost" type="number" min="0" value="${v.cost}"></div>
      <div class="field-row"><label>Priority (1–5)</label><input id="p-pri" type="number" min="1" max="5" value="${v.priority}"></div>
    </div>
    <div class="row"><button class="btn" onclick="submitPoiForm()">${editing?'Save changes':'Add place'}</button><button class="btn secondary" onclick="cancelPoiForm()">Cancel</button></div>
  </div>`;
}
function renderTransportForm(){
  const t = state.trip;
  return `<div class="panel">
    <h3>Add a booking</h3>
    <div class="grid3">
      <div class="field-row"><label>Name</label><input id="t-name" placeholder="e.g. Intercity Train"></div>
      <div class="field-row"><label>Date</label><input id="t-date" type="date" value="${t.startDate}"></div>
      <div class="field-row"><label>Arrival area</label><input id="t-area" placeholder="e.g. Riverside"></div>
      <div class="field-row"><label>Starts</label><input id="t-start" type="time" value="09:00"></div>
      <div class="field-row"><label>Ends</label><input id="t-end" type="time" value="10:00"></div>
      <div class="field-row"><label>Cost</label><input id="t-cost" type="number" min="0" value="0"></div>
    </div>
    <div class="row"><button class="btn" onclick="submitTransportForm()">Add booking</button><button class="btn secondary" onclick="cancelTransportForm()">Cancel</button></div>
  </div>`;
}
function renderPlaces(){
  const poiRows = state.pois.map(p=>{
    const loc = locationOfPoi(p.id);
    let pill = '<span class="status-pill backup">backup</span>';
    if(p.cancelled) pill = '<span class="status-pill cancelled">unavailable</span>';
    else if(loc.type==='scheduled') pill = '<span class="status-pill scheduled">Day '+(loc.dayIdx+1)+'</span>';
    return `<tr class="${p.cancelled?'cancelled':''}">
      <td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.area)}</td><td>${escapeHtml(p.category)}</td>
      <td class="mono">${fmtTime(p.openMin)}–${fmtTime(p.closeMin)}</td><td class="mono">${p.durationMin}m</td>
      <td class="mono">${fmtMoney(p.cost)}</td><td>${pill}</td>
      <td class="row" style="gap:4px;">
        <button class="btn ghost" onclick="startEditPoi('${p.id}')">Edit</button>
        <button class="btn ghost" onclick="togglePoiCancelled('${p.id}')">${p.cancelled?'Restore':'Unavailable'}</button>
        <button class="btn ghost" onclick="deletePoi('${p.id}')">Delete</button>
      </td></tr>`;
  }).join('');
  const trRows = state.transport.sort((a,b)=>a.date.localeCompare(b.date)||a.startMin-b.startMin).map(tr=>`
    <tr><td>${escapeHtml(tr.name)}</td><td class="mono">${fmtDateShort(tr.date)}</td><td class="mono">${fmtTime(tr.startMin)}–${fmtTime(tr.endMin)}</td>
    <td>${escapeHtml(tr.area)}</td><td class="mono">${fmtMoney(tr.cost)}</td>
    <td><button class="btn ghost" onclick="cancelTransport('${tr.id}')">Cancel booking</button></td></tr>`
  ).join('');
  return `<div class="container">
    <h2 class="pagehead">Places &amp; bookings</h2>
    <p class="sub">Everything the agent can schedule from. Mark a place unavailable or cancel a booking to see the itinerary rebuild.</p>

    <div class="panel">
      <div class="row" style="justify-content:space-between;"><h3 style="margin:0;">Activities &amp; attractions</h3><button class="btn small" onclick="startAddPoi()">+ Add place</button></div>
      ${state.editingPoiId ? renderPoiForm() : ''}
      <table><thead><tr><th>Name</th><th>Area</th><th>Category</th><th>Hours</th><th>Dur.</th><th>Cost</th><th>Status</th><th></th></tr></thead>
      <tbody>${poiRows || '<tr><td colspan="8" class="empty-note">No places yet.</td></tr>'}</tbody></table>
    </div>

    <div class="panel">
      <div class="row" style="justify-content:space-between;"><h3 style="margin:0;">Transportation bookings</h3><button class="btn small" onclick="startAddTransport()">+ Add booking</button></div>
      ${state.editingTransportId ? renderTransportForm() : ''}
      <table><thead><tr><th>Name</th><th>Date</th><th>Time</th><th>Area</th><th>Cost</th><th></th></tr></thead>
      <tbody>${trRows || '<tr><td colspan="6" class="empty-note">No bookings yet.</td></tr>'}</tbody></table>
    </div>
  </div>`;
}

function renderItemBlock(dayIdx,it){
  const cls = it.type==='meal'?'meal':(it.type==='transport'?'transport':'');
  const meta = it.type==='activity' ? (it.area+' · '+it.durationMinDisplay||'') : (it.area||'');
  const canAct = it.type==='activity' && !it.locked;
  return `<div class="titem ${cls}">
    <div class="time">${fmtTime(it.startMin)}<br>${fmtTime(it.endMin)}</div>
    <div class="tname">${escapeHtml(it.name)}</div>
    <div class="tmeta"><span class="tag" style="border-color:${catColor(it.category)}">${escapeHtml(it.category||'')}</span>${it.area?escapeHtml(it.area):''}${it.locked?' · booked':''}</div>
    <div class="tcost">${fmtMoney(it.cost)}</div>
    ${canAct ? `<div class="actions">
        <button class="btn ghost" onclick="cancelDayItem(${dayIdx},'${it.id}')">Cancel</button>
        <button class="btn ghost" onclick="delayDayItem(${dayIdx},'${it.id}',30)">Delay 30m</button>
        <button class="btn ghost" onclick="delayDayItem(${dayIdx},'${it.id}',60)">Delay 1h</button>
        <button class="btn ghost" onclick="rebuildAfter(${dayIdx},'${it.id}')">Rebuild rest of day</button>
      </div>` : ''}
  </div>`;
}
function renderItinerary(){
  if(!state.days.length) return `<div class="container"><h2 class="pagehead">Itinerary</h2><p class="sub">Finish the trip setup first — the agent needs a destination and dates to build a day-by-day plan.</p></div>`;
  const viewIdx = state._itinView!=null ? state._itinView : 0;
  const dayTabs = state.days.map((d,i)=>`<button class="day-tab ${i===viewIdx?'active':''}" onclick="setItinDay(${i})"><div class="d1">Day ${i+1}</div><div class="d2">${fmtDateShort(d.date)}</div></button>`).join('');
  const day = state.days[viewIdx];
  const conflicts = detectConflicts(day);
  const over = day.spent>day.budget;
  const suggestions = suggestionsForDay(viewIdx,4);
  return `<div class="container">
    <h2 class="pagehead">Itinerary</h2>
    <p class="sub">Built from your interests, opening hours and travel time between areas — grouped to cut down on back-and-forth.</p>
    <div class="day-tabs">${dayTabs}</div>
    <div class="daybar">
      <h3>Day ${viewIdx+1} · ${fmtDateLabel(day.date)}</h3>
      <div class="cost ${over?'over':''}">${fmtMoney(day.spent)} / ${fmtMoney(day.budget)}${over?' (over)':''}</div>
    </div>
    ${conflicts.length ? `<div class="conflict-banner">⚠ ${conflicts.length} scheduling conflict${conflicts.length>1?'s':''}: ${conflicts.map(c=>c[0].name+' overlaps '+c[1].name).join('; ')}. Try "Rebuild rest of day" on the earlier item.</div>` : ''}
    <div class="timeline">
      ${day.items.length ? day.items.map(it=>renderItemBlock(viewIdx,it)).join('') : '<div class="empty-note">Nothing scheduled yet for this day.</div>'}
    </div>
    ${suggestions.length ? `<div class="suggest-box">
      <div style="font-weight:600; margin-bottom:4px;">You could also fit in:</div>
      ${suggestions.map(s=>`<div class="sitem"><span>${escapeHtml(s.poi.name)} — ${escapeHtml(s.poi.area)} · ${fmtMoney(s.poi.cost)} · from ${fmtTime(s.gapStart)}</span><button class="btn small" onclick="attemptInsert(${viewIdx},'${s.poi.id}',${s.gapStart})">Add</button></div>`).join('')}
    </div>` : ''}
  </div>`;
}

function renderAsk(){
  const examples = [
    'What should I do tomorrow morning?',
    'Can I fit the Botanical Gardens into today?',
    'Which activities are close to my hotel?',
    'What happens if the River Cruise is cancelled?'
  ];
  const dayOpts = state.days.map((d,i)=>`<option value="${i}" ${state.currentDayIndex===i?'selected':''}>Day ${i+1} · ${fmtDateShort(d.date)}</option>`).join('');
  return `<div class="container">
    <h2 class="pagehead">Ask TravelPilot</h2>
    <p class="sub">Questions are answered from your actual itinerary — not general travel advice.</p>
    ${state.days.length ? `<div class="field-row" style="max-width:260px;"><label>Simulate "today" as</label><select onchange="setCurrentDay(this.value)">${dayOpts}</select></div>` : ''}
    <div class="ask-box">
      <input id="ask-input" placeholder="Ask about your trip..." onkeydown="if(event.key==='Enter')askSubmit()">
      <button class="btn" onclick="askSubmit()">Ask</button>
    </div>
    <div class="examples">${examples.map(e=>`<button class="ex-chip" onclick="askExample('${e.replace(/'/g,"\\'")}')">${e}</button>`).join('')}</div>
    <div class="qa-log">
      ${state.qaLog.slice().reverse().map(qa=>`<div class="qa-item"><div class="q">${escapeHtml(qa.q)}</div><div class="answer">${escapeHtml(qa.a)}</div></div>`).join('') || '<p class="sub">Ask something to get started.</p>'}
    </div>
  </div>`;
}

function renderDashboard(){
  if(!state.days.length) return `<div class="container"><h2 class="pagehead">Trip dashboard</h2><p class="sub">Finish setup to generate the dashboard.</p></div>`;
  const totals = tripTotals();
  const catCounts = {};
  state.days.flatMap(d=>d.items).forEach(it=>{ if(it.type==='activity') catCounts[it.category]=(catCounts[it.category]||0)+1; });
  const transportItems = state.days.flatMap(d=>d.items).filter(it=>it.type==='transport');
  const transportCost = sumCosts(transportItems);
  const activityCostOnly = sumCosts(state.days.flatMap(d=>d.items).filter(it=>it.type==='activity'));
  const mealCost = sumCosts(state.days.flatMap(d=>d.items).filter(it=>it.type==='meal'));
  const closingSoon = [];
  state.days.forEach((d,di)=>d.items.forEach(it=>{ if(it.type==='activity' && it.source && (it.source.closeMin-it.endMin)<=20) closingSoon.push({dayIdx:di,it}); }));

  return `<div class="container">
    <div class="row" style="justify-content:space-between;">
      <h2 class="pagehead">Trip dashboard</h2>
      <button class="btn secondary no-print" onclick="window.print()">Print / Export</button>
    </div>
    <p class="sub">${escapeHtml(state.trip.destination)} · ${fmtDateShort(state.trip.startDate)} – ${fmtDateShort(state.trip.endDate)} · ${totals.numDays} days</p>

    <div class="dash-grid">
      <div class="panel">
        <h3>Budget summary</h3>
        <div class="stat"><span>Total budget</span><span class="n">${fmtMoney(totals.budget)}</span></div>
        <div class="stat"><span>Accommodation (${totals.numNights} nights)</span><span class="n">${fmtMoney(totals.accomTotal)}</span></div>
        <div class="stat"><span>Activities</span><span class="n">${fmtMoney(activityCostOnly)}</span></div>
        <div class="stat"><span>Transport &amp; transfers</span><span class="n">${fmtMoney(transportCost)}</span></div>
        <div class="stat"><span>Meals</span><span class="n">${fmtMoney(mealCost)}</span></div>
        <div class="stat" style="border-bottom:none; font-weight:700;"><span>Remaining</span><span class="n ${totals.remaining<0?'':''}" style="color:${totals.remaining<0?'var(--rust)':'var(--teal)'}">${fmtMoney(totals.remaining)}</span></div>
      </div>
      <div class="panel">
        <h3>Trip essentials</h3>
        <div class="stat"><span>Accommodation</span><span>${escapeHtml(state.accommodation.name||'—')} (${escapeHtml(state.accommodation.area||'—')})</span></div>
        <div class="stat"><span>Interests</span><span>${state.trip.interests.join(', ')||'—'}</span></div>
        <div class="stat"><span>Pace</span><span>${state.trip.pace}</span></div>
        <div class="stat"><span>Day window</span><span class="n">${fmtTime(state.trip.dayStartMin)}–${fmtTime(state.trip.dayEndMin)}</span></div>
        <div class="stat" style="border-bottom:none;"><span>Backups available</span><span class="n">${state.backupPool.length}</span></div>
      </div>
    </div>

    <div class="panel">
      <h3>Daily itinerary</h3>
      ${state.days.map((d,i)=>`
        <div style="margin-bottom:14px;">
          <div class="row" style="justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:4px;">
            <b>Day ${i+1} · ${fmtDateLabel(d.date)}</b><span class="mono">${fmtMoney(d.spent)} / ${fmtMoney(d.budget)}</span>
          </div>
          ${d.items.map(it=>`<div class="row" style="justify-content:space-between; font-size:0.85rem; padding:4px 0; border-bottom:1px dashed var(--line);">
            <span><span class="mono" style="color:var(--text-soft);">${fmtTime(it.startMin)}</span> — ${escapeHtml(it.name)} <span class="tag" style="border-color:${catColor(it.category)}">${escapeHtml(it.category||'')}</span></span>
            <span class="mono">${fmtMoney(it.cost)}</span>
          </div>`).join('')}
        </div>
      `).join('')}
    </div>

    <div class="dash-grid">
      <div class="panel">
        <h3>Important timings</h3>
        ${transportItems.filter(it=>it.locked).map(it=>`<div class="stat"><span>${escapeHtml(it.name)}</span><span class="n">${fmtTime(it.startMin)}</span></div>`).join('') || '<p class="sub">No fixed bookings.</p>'}
        ${closingSoon.length ? '<div style="margin-top:8px;"><b style="font-size:0.8rem;">Closes soon after your visit:</b>'+closingSoon.map(c=>`<div class="stat"><span>${escapeHtml(c.it.name)} (Day ${c.dayIdx+1})</span><span class="n">closes ${fmtTime(c.it.source.closeMin)}</span></div>`).join('')+'</div>' : ''}
      </div>
      <div class="panel">
        <h3>Backup options</h3>
        ${state.backupPool.length ? state.backupPool.slice(0,10).map(p=>`<div class="stat"><span>${escapeHtml(p.name)} (${escapeHtml(p.area)})</span><span class="n">${fmtMoney(p.cost)}</span></div>`).join('') : '<p class="sub">No unscheduled places right now.</p>'}
      </div>
    </div>
  </div>`;
}

function renderMain(){
  switch(state.activeTab){
    case 'setup': return renderSetup();
    case 'places': return renderPlaces();
    case 'itinerary': return renderItinerary();
    case 'ask': return renderAsk();
    case 'dashboard': return renderDashboard();
    default: return renderSetup();
  }
}
function render(){
  const app = document.getElementById('app');
  app.innerHTML = renderHeader() +
    `<div class="shell">${renderRail()}<div class="main">${renderMain()}</div></div>` +
    (state.notice ? `<div class="notice">${escapeHtml(state.notice)}</div>` : '');
}

/* ============================== INIT ============================== */
(function init(){
  if(!load()){ state = defaultState(); }
  if(!state.days || !state.days.length){ rebuildItinerary(); } else { render(); }
})();
</script>
</body>
</html>
